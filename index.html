<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>競合ヒット動画ウォッチ</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#1f232c;--tx:#e8eaf0;--tx2:#9aa1ad;--acc:#3b82f6;--accbg:#1d3a6e;--line:#2a2f3a;--hit:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:20px;margin-bottom:4px}
.meta{color:var(--tx2);font-size:12px;margin-bottom:14px}
/* チャンネル追加ウィジェット */
.addbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:16px}
.addrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addrow input[type=text]{flex:1;min-width:240px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--tx);font-size:13px}
.addrow button{background:var(--acc);border:0;border-radius:8px;padding:8px 14px;color:#fff;font-size:13px;cursor:pointer}
.addrow button.gear{background:var(--card2);border:1px solid var(--line);color:var(--tx2)}
.addhint{color:var(--tx2);font-size:11px;margin-top:6px}
.addstatus{font-size:12px;margin-top:6px;min-height:16px}
.addstatus.ok{color:#4ade80}.addstatus.ng{color:#f87171}
.tokpanel{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.tokpanel.show{display:block}
.tokpanel input{width:100%;max-width:420px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--tx);font-size:13px;margin:6px 0}
.tokpanel .note{color:var(--tx2);font-size:11px}
.pendlist{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pend{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:11px;color:var(--tx2);display:flex;align-items:center;gap:6px;max-width:340px}
.pend span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pend b{cursor:pointer;color:#f87171;font-weight:400}
/* タブ・チップ */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tab{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;color:var(--tx);font-size:13px}
.tab.on{background:var(--acc);border-color:var(--acc)}
.chips{display:none;gap:6px;margin-bottom:10px}
.chips.show{display:flex}
.chip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 12px;cursor:pointer;color:var(--tx2);font-size:12px}
.chip.on{background:var(--accbg);border-color:var(--acc);color:var(--tx)}
#q{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--tx);font-size:13px;margin-bottom:12px}
.desc{color:var(--tx2);font-size:12px;margin-bottom:14px}
/* チャンネルセクション */
.chsec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.chhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.chhead img{width:40px;height:40px;border-radius:50%}
.chhead a{color:var(--tx);text-decoration:none;font-weight:600;font-size:15px}
.chsub{color:var(--tx2);font-size:12px}
.chrank{margin-left:auto;color:var(--tx2);font-size:11px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.vcard{background:var(--card2);border-radius:8px;overflow:hidden}
.vcard a{color:var(--tx);text-decoration:none}
.vcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.vbody{padding:8px}
.vtitle{font-size:12px;height:3em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vstats{color:var(--tx2);font-size:11px;margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rankn{display:inline-block;background:var(--acc);color:#fff;border-radius:4px;font-size:11px;padding:0 6px;margin-right:4px}
.stbadge{background:var(--hit);color:#000;border-radius:4px;font-size:10px;padding:0 5px;font-weight:600}
.empty{color:var(--tx2);font-size:12px;padding:8px 0}
.hitrow{display:flex;align-items:center;gap:6px;color:var(--tx2);font-size:11px;margin-top:4px}
.hitrow img{width:18px;height:18px;border-radius:50%}
details.removed{margin-top:24px;color:var(--tx2);font-size:12px}
details.removed li{margin-left:20px}
</style>
</head>
<body>
<div class="wrap">
<h1>競合ヒット動画ウォッチ</h1>
<div class="meta" id="meta">読み込み中…</div>

<div class="addbox">
  <div class="addrow">
    <input type="text" id="addurl" placeholder="ウォッチに追加: チャンネルURL・@ハンドル・動画URL を貼る">
    <button onclick="addChannel()">追加</button>
    <button class="gear" onclick="document.getElementById('tokpanel').classList.toggle('show')">&#9881; 設定</button>
  </div>
  <div class="addstatus" id="addstatus"></div>
  <div class="addhint">ここに追加したチャンネルは、次回の週次巡回（毎週月曜朝）から自動的に監視対象になります。</div>
  <div class="pendlist" id="pendlist"></div>
  <div class="tokpanel" id="tokpanel">
    <div class="note">初回のみ: GitHubトークン（hit-watch-updater）を登録してください。このブラウザ内にのみ保存されます。</div>
    <input type="password" id="tokinput" placeholder="github_pat_... または ghp_...">
    <div class="addrow">
      <button onclick="saveToken()">トークンを保存</button>
      <button class="gear" onclick="clearToken()">削除</button>
    </div>
    <div class="note" id="tokstate"></div>
  </div>
</div>

<div class="tabs">
  <div class="tab" data-v="stk" onclick="setTab(this)">拡散率ランキング</div>
  <div class="tab" data-v="new" onclick="setTab(this)">新しい順</div>
  <div class="tab on" data-v="year" onclick="setTab(this)">直近1年トップ10</div>
  <div class="tab" data-v="all" onclick="setTab(this)">各ch歴代トップ10</div>
</div>
<div class="chips" id="chips">
  <div class="chip on" data-days="365" onclick="setDays(this)">直近1年</div>
  <div class="chip" data-days="30" onclick="setDays(this)">直近30日</div>
</div>
<input id="q" placeholder="チャンネル・タイトルで絞り込み…" oninput="render()">
<div class="desc" id="desc"></div>
<div id="view"></div>
<details class="removed" id="removedbox"></details>
</div>

<script>
const OWNER='kksriders', REPO='hit-watch', PENDING='pending_channels.json';
const API='https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/';
let D=null, TAB='year', DAYS=365;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>Number(n||0).toLocaleString('ja-JP');
const yurl=id=>'https://www.youtube.com/watch?v='+id;
const thumb=id=>'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg';
const churl=uc=>'https://www.youtube.com/channel/'+uc;

async function load(){
  try{
    D=await fetch('data.json?v='+Date.now()).then(r=~r.json());
    const m=D.meta||{};
    document.getElementById('meta').textContent='最終更新 '+(m.date||'?')+'／監視 '+D.channels.length+'ch（5分未満の動画は除外・長尺のみ）／ヒット定義: ST≧5 または STK≧5'+(m.cutoff365?('／直近1年=公開日'+m.cutoff365+'以降'):'');
    renderRemoved(); render(); loadPending();
  }catch(e){ document.getElementById('meta').textContent='data.json の読み込みに失敗しました: '+e.message; }
}
function setTab(el){ document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on')); el.classList.add('on'); TAB=el.dataset.v; render(); }
function setDays(el){ document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on')); el.classList.add('on'); DAYS=+el.dataset.days; render(); }

function render(){
  if(!D) return;
  const q=(document.getElementById('q').value||'').toLowerCase();
  const chips=document.getElementById('chips');
  (TAB==='stk'||TAB==='new')?chips.classList.add('show'):chips.classList.remove('show');
  const v=document.getElementById('view'), desc=document.getElementById('desc');
  if(TAB==='year'||TAB==='all'){
    const f=TAB==='year'?'top10_year':'top10_all';
    desc.textContent=TAB==='year'
      ?'各チャンネルの直近1年（公開日が365日以内）の再生数トップ10（5分以上の動画のみ）。サムネ／チャンネル名タップで開けます。'
      :'各チャンネルの全期間の再生数トップ10（5分以上の動画のみ）。半年に1回（1/1・7/1）更新。';
    const chs=[...D.channels].sort((a,b)=>b.subs-a.subs);
    let html='', rank=0;
    for(const c of chs){
      rank++;
      const list=Array.isArray(c[f])?c[f]:[];   // フォールバックなし: top10_year が無ければ「データなし」
      const nameHit=(c.title||'').toLowerCase().includes(q);
      const vids=q&&!nameHit?list.filter(x=>(x.t||'').toLowerCase().includes(q)):list;
      if(q&&!nameHit&&!vids.length) continue;
      html+='<div class="chsec"><div class="chhead"><img src="'+esc(c.icon)+'" loading="lazy" alt="">'
        +'<div><a href="'+churl(c.uc)+'" target="_blank" rel="noopener">'+esc(c.title)+'</a>'
        +'<div class="chsub">登録 '+num(c.subs)+'人 ・ 最終投稿(横動画) '+esc(c.lastDate||'-')+'</div></div>'
        +'<div class="chrank">#'+rank+' 登録者順</div></div>';
      if(!vids.length){ html+='<div class="empty">データなし（次回更新をおe��ちください）</div></div>'; continue; }
      html+='<div class="grid">'+vids.map((x,i)=>vcard(x,i+1)).join('')+'</div></div>';
    }
    v.innerHTML=html||'<div class="empty">該当なし</div>';
  }else{
    const cutoff=new Date(Date.now()-DAYS*86400*1000);
    let hits=(D.hits||[]).filter(h=>new Date(h.d)>=cutoff);
    if(q) hits=hits.filter(h=>(h.title||'').toLowerCase().includes(q)||(h.t||'').toLowerCase().includes(q));
    for(const h of hits){ if(h.st==null)h.st=h.subs?h.v/h.subs:0; if(h.stk==null)h.stk=h.median?h.v/h.median:0; }
    hits.sort(TAB==='stk'?(a,b)=>Math.max(b.st,b.stk)-Math.max(a.st,a.stk):(a,b)=>a.d<b.d?1:-1);
    desc.textContent=(TAB==='stk'?'拡散率（ST=再生数÷登録者数／STK=再生数÷直近20本の中央値）の高い順。':'ヒット動画を公開日の新しい順に表示。')
      +'対象: 公開日が直近'+(DAYS===365?'1年':'30日')+'以内のヒット動画（ST≧5 または STK≧5）。';
    document.getElementById('view').innerHTML=hits.length
      ?'<div class="grid">'+hits.map((h,i)=>hitcard(h,i+1)).join('')+'</div>'
      :'<div class="empty">この期間のヒット動画はありません</div>';
  }
}
function vcard(x,n){
  return '<div class="vcard"><a href="'+yurl(x.id)+'" target="_blank" rel="noopener"><img src="'+thumb(x.id)+'" loading="lazy" alt="">'
    +'<div class="vbody"><div class="vtitle"><span class="rankn">'+n+'</span>'+esc(x.t)+'</div>'
    +'<div class="vstats">'+num(x.v)+' 回 ・ '+esc(x.d)+'</div></div></a></div>';
}
function hitcard(h,n){
  const st=(Math.round(h.st*10)/10).toFixed(1), stk=(Math.round(h.stk*10)/10).toFixed(1);
  return '<div class="vcard"><a href="'+yurl(h.id)+'" target="_blank" rel="noopener"><img src="'+thumb(h.id)+'" loading="lazy" alt="">'
    +'<div class="vbody"><div class="vtitle"><span class="rankn">'+n+'</span>'+esc(h.t)+'</div>'
    +'<div class="vstats">'+num(h.v)+' 回 ・ '+esc(h.d)+' <span class="stbadge">ST '+st+'</span><span class="stbadge">STK '+stk+'</span></div>'
    +'<div class="hitrow"><img src="'+esc(h.icon)+'" loading="lazy" alt="">'+esc(h.title)+'（登録 '+num(h.subs)+'人）</div></div></a></div>';
}
function renderRemoved(){
  const r=D.removed||[]; const box=document.getElementById('removedbox');
  if(!r.length){box.style.display='none';return;}
  box.innerHTML='<summary>休止・取得不可チャンネル（'+r.length+'ch）</summary><ul>'
    +r.map(x=>'<li>'+esc(x.name||x.slug)+'（最終長尺投稿: '+esc(x.lastDate||'不明')+'）</li>').join('')+'</ul>';
}

/* ===== チャンネル追加ウィジェット ===== */
const tok=()=>localStorage.getItem('hw_gh_token')||'';
function saveToken(){ const t=document.getElementById('tokinput').value.trim(); if(!t){setSt('トークンが空です','ng');return;} localStorage.setItem('hw_gh_token',t); document.getElementById('tokinput').value=''; tokState(); setSt('トークンを保存しました','ok'); }
function clearToken(){ localStorage.removeItem('hw_gh_token'); tokState(); setSt('トークンを削除しました','ok'); }
function tokState(){ document.getElementById('tokstate').textContent=tok()?'登録状態: 登録済み':'登録状態: 未登録'; }
function setSt(msg,cls){ const el=document.getElementById('addstatus'); el.textContent=msg; el.className='addstatus '+(cls||''); }
function normUrl(s){
  s=s.trim();
  if(!s) return null;
  if(/^@[\w.\-]+$/.test(s)) return 'https://www.youtube.com/'+s;
  if(/^UC[\w\-]{22}$/.test(s)) return 'https://www.youtube.com/channel/'+s;
  if(!/^https?:\/\//.test(s)) s='https://'+s;
  try{ const u=new URL(s); if(!/(^|\.)youtube\.com$|(^|\.)youtu\.be$/.test(u.hostname)) return null; return u.href; }catch(e){ return null; }
}
async function getPending(){
  const r=await fetch(API+PENDING+'?ref=main&ts='+Date.now(),{headers:tok()?{Authorization:'Bearer '+tok()}:{}});
  if(r.status===404) return {sha:null,data:{pending:[]}};
  if(!r.ok) throw new Error('取得失敗 HTTP '+r.status);
  const j=await r.json();
  return {sha:j.sha,data:JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))))};
}
async function putPending(p){
  const body={message:'update pending channels via widget',content:btoa(unescape(encodeURIComponent(JSON.stringify(p.data,null,1)))),branch:'main'};
  if(p.sha) body.sha=p.sha;
  const r=await fetch(API+PENDING,{method:'PUT',headers:{Authorization:'Bearer '+tok(),Accept:'application/vnd.github+json'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error('書き込み失敗 HTTP '+r.status+(r.status===401||r.status===403?'（トークンを確認してください）':''));
}
async function addChannel(){
  const raw=document.getElementById('addurl').value;
  const url=normUrl(raw);
  if(!url){ setSt('YouTubeのURL・@ハンドルとして認識できませんでした','ng'); return; }
  if(!tok()){ document.getElementById('tokpanel').classList.add('show'); tokState(); setSt('初回はトークンの登録が必要です（⚙設定）','ng'); return; }
  setSt('追加中…','');
  try{
    const p=await getPending();
    if(p.data.pending.some(x=>x.url===url)){ setSt('すでに追加待ちに入っています','ng'); return; }
    p.data.pending.push({url:url,added:new Date().toISOString().slice(0,10)});
    await putPending(p);
    document.getElementById('addurl').value='';
    setSt('追加しました。次回の週次巡回から監視対象になります','ok');
    renderPending(p.data.pending);
  }catch(e){ setSt('エラー: '+e.message,'ng'); }
}
async function removePending(url){
  try{ const p=await getPending(); p.data.pending=p.data.pending.filter(x=>x.url!==url); await putPending(p); renderPending(p.data.pending); setSt('取り消しました','ok'); }
  catch(e){ setSt('エラー: '+e.message,'ng'); }
}
async function loadPending(){ try{ const p=await getPending(); renderPending(p.data.pending); }catch(e){} }
function renderPending(list){
  document.getElementById('pendlist').innerHTML=(list||[]).map(x=>'<div class="pend"><span>'+esc(x.url)+'</span><b onclick="removePending(\''+esc(x.url)+'\')">×</b></div>').join('')+'</ul>';}
tokState(); load();
</script>
</body>
</html>
